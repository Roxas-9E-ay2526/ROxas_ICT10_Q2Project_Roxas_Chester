<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <title>Seatwork 1 - 2nd Quarter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #f4f6f8;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            flex-wrap: wrap;
        }

        .nav-brand {
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            text-decoration: none;
            font-size: 1.2rem;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1rem;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 0.5rem 0.8rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .nav-links a:hover,
        .nav-links a[aria-current="page"] {
            background-color: #334155;
            color: #fff;
        }

        .nav-toggle {
            display: none;
            background: #334155;
            color: #fff;
            border: none;
            padding: 0.5rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .nav-toggle {
                display: block;
            }

            .nav-links {
                display: none;
                width: 100%;
                flex-direction: column;
                margin-top: 1rem;
            }

            .nav-links.open {
                display: flex;
            }
        }

        header {
            text-align: center;
            padding: 2rem 1rem 1rem;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            color: #1e293b;
            margin-bottom: 0.3rem;
        }

        header p {
            color: #64748b;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        form {
            background: #ffffff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 360px;
        }

        form input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 1rem;
        }

        form input[type="button"] {
            width: 100%;
            padding: 0.75rem;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        form input[type="button"]:hover {
            background-color: #1d4ed8;
        }

        #result {
            margin-top: 1.5rem;
            width: 100%;
            max-width: 360px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
        }

        footer {
            background-color: #1e293b;
            color: #94a3b8;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <a class="nav-brand" href="index.html">
            ICT Club
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links"
                onclick="var l=document.getElementById('nav-links');var o=l.classList.toggle('open');this.setAttribute('aria-expanded',o);">
            Menu
        </button>
        <ul class="nav-links" id="nav-links">
            <li><a href="index.html" aria-current="page">Homepage</a></li>
            <li><a href="element-checker.html">Element Checker</a></li>
            <li><a href="club-members.html">School Club Members</a></li>
            <li><a href="creator.html">Meet the Creator</a></li>
        </ul>
    </nav>

    <header>
        <h1>ICT Club Checker</h1>
        <p>Candidate Verification System</p>
    </header>

    <main>
        <form>
            <input type="text" id="first_name" placeholder="Enter your First Name">
            <input type="text" id="last_name" placeholder="Enter your Last Name">
            <input type="button" py-click="candidate_checker" value="Enter">
        </form>
        <div id="result"></div>
    </main>

    <footer>
        &copy; 2026 ICT Club &bull; Seatwork 1 &bull; 2nd Quarter
    </footer>

    <py-script src="main.py"></py-script>
</body>
</html>
