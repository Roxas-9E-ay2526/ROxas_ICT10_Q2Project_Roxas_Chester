<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <title>2nd Quarter | Drill 2</title>
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        /* Navigation */
        .site-nav {
            background-color: #1e293b;
        }

        .site-nav .navbar-brand {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            color: #fff;
        }

        .site-nav .nav-link {
            color: #cbd5e1;
            font-weight: 600;
            padding: 0.5rem 0.8rem;
            border-radius: 4px;
        }

        .site-nav .nav-link:hover,
        .site-nav .nav-link.active {
            color: #fff;
            background-color: #334155;
        }

        h3 {
            font-family: 'Orbitron', sans-serif;
            color: #1e293b;
            font-size: 1.3rem;
        }

        .form-control {
            border: 1px solid #cbd5e1;
            padding: 0.75rem;
            font-size: 1rem;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-primary {
            background-color: #2563eb;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        #output {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-left: 4px solid #2563eb;
            min-height: 80px;
            color: #0f172a;
            font-size: 1rem;
        }

        #output:empty {
            display: none;
        }

        .site-footer {
            background-color: #1e293b;
            color: #94a3b8;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg sticky-top site-nav" aria-label="Main navigation">
        <div class="container-fluid px-3 px-lg-4">
            <a class="navbar-brand" href="index.html">
                ICT Club
            </a>
            <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainNav" aria-controls="mainNav"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="mainNav">
                <ul class="navbar-nav gap-lg-1">
                    <li class="nav-item"><a class="nav-link" href="index.html">Homepage</a></li>
                    <li class="nav-item"><a class="nav-link" href="element-checker.html">Element Checker</a></li>
                    <li class="nav-item"><a class="nav-link active" href="club-members.html" aria-current="page">School Club Members</a></li>
                    <li class="nav-item"><a class="nav-link" href="creator.html">Meet the Creator</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5 flex-grow-1" style="max-width: 540px;">
        <h3 class="mb-4">Add new club member:</h3>
        <form class="mb-4">
            <div class="mb-3">
                <input type="text" id="first_name" class="form-control" placeholder="Enter the first name">
            </div>
            <div class="mb-3">
                <input type="text" id="last_name" class="form-control" placeholder="Enter the last name">
            </div>
            <input type="button" value="Submit" py-click="result_checker" class="btn btn-primary w-100">
        </form>
        <div id="output" class="p-3 rounded"></div>
    </div>

    <footer class="site-footer">
        &copy; 2026 <span>ICT Club</span> &bull; Drill 2 &bull; 2nd Quarter
    </footer>

    <py-script src="main.py"></py-script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
